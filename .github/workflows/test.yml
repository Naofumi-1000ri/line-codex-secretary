name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --global @openai/codex@0.153.4
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: npm run typecheck
      - run: npm test
        env:
          LINE_SECRETARY_TEST_CODEX: '1'
      - run: node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config apps/worker/wrangler.jsonc
